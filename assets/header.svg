<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Chen Chunzhe — memory-first personal agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1329"/>
      <stop offset="0.55" stop-color="#151a36"/>
      <stop offset="1" stop-color="#1d1733"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6ecda"/>
      <stop offset="0.7" stop-color="#f3d9b0"/>
      <stop offset="1" stop-color="#e9a06b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4572e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e4572e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .grid { stroke:#242b50; stroke-width:1; opacity:.35; }
      .edge { stroke:#3a4270; stroke-width:1.2; fill:none; opacity:.55; }
      .node { fill:#8ea2d8; }
      .node-core { fill:#f0dcc0; }
      .pulse { fill:none; stroke:#e4572e; stroke-width:1.4; transform-box:fill-box; transform-origin:center; animation:ripple 3.4s ease-out infinite; }
      .pulse.b { animation-delay:1.7s; stroke:#9fb8a8; }
      .card { fill:#1b2144; stroke:#3d4677; stroke-width:1; opacity:1; animation:cardin 1.1s ease-out both; }
      .card.t { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; fill:#c9d2f0; }
      .kicker { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; letter-spacing:4px; fill:#8ea2d8; }
      .name { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:54px; font-weight:700; fill:url(#name); clip-path:inset(0 0 0 0); animation:type 1.7s steps(13,end) .2s both; }
      .caret { fill:#e4572e; animation:blink 1.15s steps(1,end) infinite; }
      .cn { font-family:"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; font-size:24px; font-weight:600; fill:#f0b26b; letter-spacing:6px; opacity:1; animation:fadein 1s ease-out .9s both; }
      .sub { font-family:"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; font-size:17px; fill:#b9c2e0; opacity:1; animation:fadein 1s ease-out 1.25s both; }
      .meta { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; letter-spacing:1.5px; fill:#7f88ad; opacity:1; animation:fadein 1s ease-out 1.5s both; }
      .tick { fill:#3a4270; }
      .tick.hot { fill:#e4572e; }
      @keyframes type { from { clip-path:inset(0 100% 0 0); } }
      @keyframes blink { 50% { opacity:0; } }
      @keyframes fadein { from { opacity:0; } }
      @keyframes cardin { from { opacity:0; transform:translateY(8px); } }
      @keyframes ripple { 0% { transform:scale(.4); opacity:.9; } 70% { transform:scale(2.6); opacity:0; } 100% { opacity:0; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g class="grid">
    <path d="M0 80H1200M0 160H1200M0 240H1200M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>

  <g class="edge">
    <path d="M872 178 L944 118 L1028 146 L1092 92 L1128 178 L1046 224 L956 210 Z"/>
    <path d="M944 118 L956 210 M1028 146 L1046 224 M872 178 L1046 224 M944 118 L1092 92"/>
  </g>
  <circle class="pulse" cx="944" cy="118" r="7"/>
  <circle class="pulse b" cx="1046" cy="224" r="7"/>
  <g>
    <circle class="node" cx="872" cy="178" r="5"/>
    <circle class="node-core" cx="944" cy="118" r="7"/>
    <circle class="node" cx="1028" cy="146" r="5.5"/>
    <circle class="node-core" cx="1092" cy="92" r="5"/>
    <circle class="node" cx="1128" cy="178" r="4.5"/>
    <circle class="node-core" cx="1046" cy="224" r="6"/>
    <circle class="node" cx="956" cy="210" r="4.5"/>
  </g>
  <g>
    <rect class="card" x="828" y="246" width="92" height="26" rx="7"/>
    <text class="card t" x="842" y="263">episode</text>
  </g>
  <g>
    <rect class="card" x="1054" y="122" width="74" height="26" rx="7" style="animation-delay:.25s"/>
    <text class="card t" x="1068" y="139" style="animation-delay:.25s">fact</text>
  </g>
  <g>
    <rect class="card" x="1064" y="240" width="104" height="26" rx="7" style="animation-delay:.5s"/>
    <text class="card t" x="1078" y="257" style="animation-delay:.5s">preference</text>
  </g>

  <g>
    <rect class="tick" x="896" y="286" width="10" height="14" rx="2"/>
    <rect class="tick" x="912" y="282" width="10" height="18" rx="2"/>
    <rect class="tick hot" x="928" y="276" width="10" height="24" rx="2"/>
    <rect class="tick" x="944" y="284" width="10" height="16" rx="2"/>
    <rect class="tick" x="960" y="280" width="10" height="20" rx="2"/>
    <rect class="tick" x="976" y="274" width="10" height="26" rx="2"/>
    <rect class="tick" x="992" y="283" width="10" height="17" rx="2"/>
    <rect class="tick" x="1008" y="278" width="10" height="22" rx="2"/>
    <rect class="tick hot" x="1024" y="272" width="10" height="28" rx="2"/>
    <rect class="tick" x="1040" y="285" width="10" height="15" rx="2"/>
    <rect class="tick" x="1056" y="280" width="10" height="20" rx="2"/>
    <rect class="tick" x="1072" y="276" width="10" height="24" rx="2"/>
    <rect class="tick" x="1088" y="284" width="10" height="16" rx="2"/>
    <rect class="tick" x="1104" y="279" width="10" height="21" rx="2"/>
  </g>

  <text class="kicker" x="72" y="84">PERSONAL AGENT · MEMORY · PERSONALIZATION</text>
  <text class="name" x="70" y="158">Chen Chunzhe</text>
  <rect class="caret" x="500" y="116" width="3" height="44"/>
  <text class="cn" x="74" y="200">陈淳哲</text>
  <text class="sub" x="74" y="244">记忆图谱 · 可引用检索 · 个性化每日简报</text>
  <text class="meta" x="74" y="278">GUANGZHOU UNIVERSITY · FAMULIX</text>
</svg>
